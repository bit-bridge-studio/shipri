# Coturn Configuration Blueprint for Shipri

# Listening Ports (3478 is standard STUN/TURN, 443 is TLS bypass)
listening-port=3478
tls-listening-port=443

# Force TCP and UDP modes
listening-ip=0.0.0.0

# Shared Secret for dynamic REST API token credentials
use-auth-secret
static-auth-secret=your_super_secret_here
realm=shipri.app

# Logging & Quotas
fingerprint
lt-cred-mech
syslog
total-quota=0
user-quota=0

# Disable insecure legacy protocols
no-sslv3
no-tlsv1
no-tlsv1_1
