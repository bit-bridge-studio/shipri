# Hardened Coturn Configuration for Shipri (BE-6)
# Do not commit static-auth-secret, external-ip, or private key material to this file.
# Provide runtime overrides via docker-compose.yml (--profile turn):
#   --listening-ip=${TURN_LISTENING_IP}
#   --external-ip=${TURN_EXTERNAL_IP}
#   --cert=${TURN_TLS_CERT_PATH}
#   --pkey=${TURN_TLS_KEY_PATH}
#   --static-auth-secret=${TURN_SHARED_SECRET}

# Listening Ports (3478 UDP/TCP standard STUN/TURN; 443 TCP/TLS on dedicated turn.shipri.app IP)
listening-port=3478
tls-listening-port=443

# Dynamic Relay Port Range
min-port=49152
max-port=65535

# Time-Limited REST API Authentication (HMAC-SHA1 via runtime --static-auth-secret)
use-auth-secret
lt-cred-mech
realm=turn.shipri.app
fingerprint
stale-nonce=600

# Security Hardening: Disable Admin CLI, Loopback/Multicast, and Internal Network SSRF Targets
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Modern TLS Only
no-sslv3
no-tlsv1
no-tlsv1_1

# Resource Quotas and Logging
total-quota=1200
user-quota=2
syslog
