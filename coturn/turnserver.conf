# Coturn Configuration Blueprint for Shipri
# Do not commit static-auth-secret values to this file.
# Provide the shared secret at runtime via --static-auth-secret=${TURN_SHARED_SECRET}
# or an uncommitted deployment override generated on the host.

# Listening Ports (3478 is standard STUN/TURN, 443 is TLS bypass on a dedicated endpoint)
listening-port=3478
tls-listening-port=443

# Force TCP and UDP modes
listening-ip=0.0.0.0

# Time-limited REST API authentication (secret injected via runtime environment)
use-auth-secret
realm=turn.shipri.app

# Logging & Quotas (hardened further in BE-6)
fingerprint
lt-cred-mech
syslog
total-quota=1200
user-quota=2

# Disable insecure legacy protocols
no-sslv3
no-tlsv1
no-tlsv1_1
